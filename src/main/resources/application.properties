server.port = 8090

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/dbtravelagency
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/travel-agency
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/travel-agency/protocol/openid-connect/certs